<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- PRIMARY SEO -->
    <title>RepairXpert | AI Repair Booking, Spare Parts & Shop CRM</title>
    <meta name="description" content="RepairXpert — India's smart repair platform. Book mobile, laptop, TV & AC repairs with AI quotes, shop near you, buy genuine spare parts, and run your service business with a built-in CRM.">
    <meta name="keywords" content="RepairXpert, repair booking app, mobile repair near me, laptop repair, AC repair, TV repair, spare parts marketplace, service CRM, repair shop software, AI repair quote, hyperlocal repair">
    <meta name="author" content="RepairXpert" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://repairxpert.lovable.app/" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RepairXpert" />
    <meta property="og:title" content="RepairXpert | AI Repair Booking, Spare Parts & Shop CRM" />
    <meta property="og:description" content="Book verified repairs with AI quotes, shop near you & buy genuine spare parts. Shopkeepers — run your service business with the all-in-one RepairXpert CRM." />
    <meta property="og:url" content="https://repairxpert.lovable.app/" />
    <meta property="og:image" content="https://repairxpert.lovable.app/og-image.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@RepairXpert" />
    <meta name="twitter:title" content="RepairXpert | AI Repair Booking & Shop CRM" />
    <meta name="twitter:description" content="AI-first repair booking, hyperlocal shop discovery, genuine spare parts marketplace and pro CRM for repair shops." />
    <meta name="twitter:image" content="https://repairxpert.lovable.app/og-image.png">

    <!-- Structured Data (JSON-LD) for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "RepairXpert",
      "alternateName": ["RepairXpert CRM", "RepairXpert Marketplace"],
      "description": "RepairXpert is an AI-first repair booking platform, hyperlocal spare-parts marketplace and CRM for repair shops covering mobile, laptop, TV, AC and home appliances.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Android, Windows",
      "offers": {
        "@type": "Offer",
        "price": "299",
        "priceCurrency": "INR",
        "priceValidUntil": "2027-12-31"
      },
      "creator": {
        "@type": "Organization",
        "name": "RepairXpert",
        "url": "https://repairxpert.lovable.app",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+917319884599",
          "contactType": "customer support",
          "areaServed": "IN",
          "availableLanguage": ["Hindi", "English"]
        }
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "120"
      }
    }
    </script>

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function() {
        const skin = localStorage.getItem('rx-skin');
        if (skin) document.documentElement.setAttribute('data-skin', skin);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
